[project]
name = "mtv_dl"
version = "0.28.0"
description = "MediathekView Downloader"
readme = "README.md"
authors = [
    { name = "Frank Epperlein", email = "frank+mtv_dl@epperle.in" },
]
repository = "https://github.com/fnep/mtv_dl"
license = { text = "MIT License" }
classifiers = [
    "Topic :: Multimedia :: Video",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: Public Domain",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies = [
    "iso8601~=2.1.0",
    "durationpy~=0.10",
    "PyYAML~=6.0",
    "beautifulsoup4~=4.15.0",
    "rich~=15.0.0",
    "certifi>=2026.11.20,<2027.0.0",
    "ijson~=3.6.0",
    "typer~=0.29.2",
    "typer-config[yaml]~=1.5.1",
]

[project.scripts]
mtv_dl = "mtv_dl.mtv_dl:app"

[dependency-groups]
dev = [
    "mypy~=2.4.1",
    "types-PyYAML~=6.0.12.20240808",
    "types-beautifulsoup4~=4.12.0.20250516",
    "types-certifi~=2021.10.8.3",
    "pytest>=9.2,<10",
    "ruff~=0.17.3",
    "pytest-mypy~=1.1.0",
    "pytest-ruff~=0.5.0",
]


[tool.mypy]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
lint.select = [
    "A",
    "ARG",
    "E",
    "F",
    "I",
    "N",
    "PTH",
    "Q",
    "RUF",
    "SIM",
    "UP",
    "W",
]
lint.isort.force-single-line = true

[tool.pytest.ini_options]
addopts = "--doctest-modules --mypy --ruff --ruff-format"
xfail_strict = true

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

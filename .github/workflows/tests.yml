name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize ]

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --locked pytest --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Check CLI startup
        if: ${{ !cancelled() }}
        run: uv run --locked mtv_dl --help

      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
        if: ${{ always() }}

  docker:
    name: Docker runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Use the actual Dockerfile so future runtime-image updates are tested too.
      - name: Build production image without publishing
        run: docker build --pull --platform ${{ matrix.platform }} -t mtv-dl:test .

      - name: Check runtime and installed dependencies
        run: |
          docker run --rm --network none --entrypoint python mtv-dl:test --version
          docker run --rm --network none --entrypoint python mtv-dl:test -m pip check
          docker run --rm --network none --entrypoint python mtv-dl:test -m pip freeze

      - name: Check production entrypoint
        run: docker run --rm --network none mtv-dl:test --help

      - name: Run doctests against the installed wheel
        run: |
          docker run --rm --network none --entrypoint python mtv-dl:test -c '
          import doctest
          import mtv_dl.mtv_dl as module
          result = doctest.testmod(module, verbose=True)
          assert result.attempted > 0, "No doctests discovered"
          raise SystemExit(bool(result.failed))
          '
